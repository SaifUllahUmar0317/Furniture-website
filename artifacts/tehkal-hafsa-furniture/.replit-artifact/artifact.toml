kind = "web"
previewPath = "/"
title = "Tehkal Hafsa Furniture"
version = "1.0.0"
id = "artifacts/tehkal-hafsa-furniture"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25266

[services.development]
run = "pnpm --filter @workspace/tehkal-hafsa-furniture run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tehkal-hafsa-furniture", "run", "build" ]
serve = "static"
publicDir = "artifacts/tehkal-hafsa-furniture/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25266"
BASE_PATH = "/"
